<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}prompt-vc{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/markdown.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/jinja2.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    {% block head %}{% endblock %}
</head>
<body class="h-full" hx-boost="true">
    <div id="flash-container" class="flash-container" aria-live="polite"></div>

    <div class="flex h-full">
        <!-- Mobile sidebar toggle -->
        <button id="sidebar-toggle"
                class="md:hidden fixed top-3 left-3 z-40 bg-white border border-gray-200 rounded p-2 text-gray-600 hover:bg-gray-100"
                onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')"
                aria-label="Toggle navigation">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Sidebar -->
        <nav id="sidebar"
             class="w-56 bg-white border-r border-gray-200 flex flex-col flex-shrink-0 h-screen sticky top-0
                    fixed md:relative z-30 transition-transform duration-200
                    -translate-x-full md:translate-x-0"
             aria-label="Main navigation">
            <div class="p-4 border-b border-gray-200">
                <a href="/ui/" class="text-lg font-bold text-gray-900 no-underline">prompt-vc</a>
                <p class="text-xs text-gray-500 mt-0.5">Prompt Version Control</p>
            </div>
            <div class="flex-1 overflow-y-auto py-2">
                <div class="px-3 py-1">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-2 mb-1">Overview</h3>
                    <a href="/ui/" class="nav-link block px-2 py-1.5 text-sm text-gray-700 rounded hover:bg-gray-100 {% if active_page == 'dashboard' %}active{% endif %}" onclick="if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('-translate-x-full') }">Dashboard</a>
                    <a href="/ui/prompts" class="nav-link block px-2 py-1.5 text-sm text-gray-700 rounded hover:bg-gray-100 {% if active_page == 'prompts' %}active{% endif %}" onclick="if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('-translate-x-full') }">Prompts</a>
                </div>
                <div class="px-3 py-1 mt-2">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-2 mb-1">Quality</h3>
                    <a href="/ui/validate" class="nav-link block px-2 py-1.5 text-sm text-gray-700 rounded hover:bg-gray-100 {% if active_page == 'validate' %}active{% endif %}" onclick="if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('-translate-x-full') }">Validation</a>
                    <a href="/ui/audit" class="nav-link block px-2 py-1.5 text-sm text-gray-700 rounded hover:bg-gray-100 {% if active_page == 'audit' %}active{% endif %}" onclick="if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('-translate-x-full') }">Audit</a>
                </div>
                <div class="px-3 py-1 mt-2">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-2 mb-1">Explore</h3>
                    <a href="/ui/graph" class="nav-link block px-2 py-1.5 text-sm text-gray-700 rounded hover:bg-gray-100 {% if active_page == 'graph' %}active{% endif %}" onclick="if(window.innerWidth < 768) { document.getElementById('sidebar').classList.add('-translate-x-full') }">Graph</a>
                </div>
            </div>
            <div class="p-3 border-t border-gray-200 text-xs text-gray-400">
                <a href="/api/health" class="hover:text-gray-600" hx-boost="false">API</a>
                &middot;
                <a href="/docs" class="hover:text-gray-600" hx-boost="false">Docs</a>
            </div>
        </nav>

        <!-- Sidebar overlay for mobile -->
        <div id="sidebar-overlay" class="hidden md:hidden fixed inset-0 bg-black bg-opacity-30 z-20"
             onclick="document.getElementById('sidebar').classList.add('-translate-x-full'); this.classList.add('hidden')"></div>

        <!-- Main content -->
        <main class="flex-1 overflow-y-auto min-w-0" aria-label="Main content">
            <div class="max-w-6xl mx-auto px-4 md:px-6 pt-14 md:pt-6 pb-6 ml-0 md:ml-0">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
