<div class="divide-y divide-gray-50">
    {% for issue in r.issues %}
    <div class="px-4 py-2 flex items-start gap-3">
        <span class="mt-0.5 flex-shrink-0">
            {% if issue.level == 'error' %}
            <span class="inline-block w-2 h-2 bg-red-500 rounded-full" aria-hidden="true"></span>
            {% else %}
            <span class="inline-block w-2 h-2 bg-amber-500 rounded-full" aria-hidden="true"></span>
            {% endif %}
        </span>
        <div class="min-w-0">
            <p class="text-sm text-gray-800">
                <span class="font-medium text-xs uppercase {% if issue.level == 'error' %}text-red-600{% else %}text-amber-600{% endif %}">{{ issue.level }}:</span>
                {{ issue.message }}
            </p>
            <p class="text-xs text-gray-400 mt-0.5">
                {{ issue.file }}
                {% if issue.line %} line {{ issue.line }}{% endif %}
                {% if issue.annotation_id %} ({{ issue.annotation_id }}){% endif %}
            </p>
        </div>
    </div>
    {% endfor %}
</div>
