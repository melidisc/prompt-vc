<div id="flash-oob" hx-swap-oob="afterbegin:#flash-container">
    <div class="flash-msg flash-{{ flash_type }}">
        <div class="flex items-center justify-between gap-3">
            <span class="text-sm">{{ flash_message }}</span>
            <button onclick="dismissFlash(this)" class="text-sm opacity-60 hover:opacity-100" aria-label="Dismiss">&times;</button>
        </div>
    </div>
</div>
