site_name: prompt-vc
site_description: Version control metadata for LLM prompts
site_url: https://melidisc.github.io/prompt-vc
repo_url: https://github.com/melidisc/prompt-vc
repo_name: melidisc/prompt-vc

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - End-to-End Example: end-to-end-example.md
  - Reference:
    - CLI Reference: cli.md
    - Meta Schema: meta-schema.md
    - Manifest Schema: manifest-schema.md
  - Guides:
    - Best Practices: best-practices.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/melidisc/prompt-vc
