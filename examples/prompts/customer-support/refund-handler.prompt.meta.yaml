schema_version: "1.0"

id: refund-handler
name: Customer Support Refund Handler
created: "2024-01-10"
authors:
  - alice@acme.com
  - bob@acme.com

intent: |
  Handle refund requests for orders. Should:
  - Acknowledge customer frustration before discussing policy
  - Never promise refunds above the policy limit
  - Offer alternatives (store credit, exchange) when refund isn't possible
  - Escalate to human if customer mentions legal action
  
  Output: JSON with decision, reasoning, refund_amount, alternatives_offered, 
  and suggested_response fields.

assumptions:
  model: claude-sonnet-4-20250514
  min_context_window: 8000
  max_tokens: 1024
  expected_latency_ms: 2000
  template_engine: jinja2
  
  upstream_dependencies:
    - service: order-api
      provides: [order_id, order_total, order_date]
    - service: policy-service
      provides: [refund_policy]
    - service: crm
      provides: [customer_name]
  
  downstream_consumers:
    - service: ticket-system
      expects: JSON decision object

variables:
  company_name:
    type: string
    description: Company name for branding
    required: true
    default: "Acme Corp"
  
  customer_name:
    type: string
    description: Customer's display name from CRM
    required: true
  
  order_id:
    type: string
    description: UUID of the order
    required: true
  
  order_total:
    type: number
    description: Total order amount in USD
    required: true
  
  order_date:
    type: string
    description: ISO 8601 date of the order
    required: true
  
  customer_message:
    type: string
    description: The customer's refund request message
    required: true
  
  refund_policy:
    type: object
    description: Policy configuration from policy-service
    required: true
    schema_ref: ../../schemas/refund-policy.schema.json

evaluation:
  metrics:
    - name: empathy_score
      target: ">= 4.0"
      measured_by: eval/empathy-classifier.py
    - name: policy_compliance
      target: "100%"
      measured_by: eval/compliance-checker.py
    - name: json_validity
      target: "100%"
      measured_by: eval/json-validator.py
  test_cases_ref: tests/refund-handler.cases.yaml

annotations:
  - id: ann_empathy_01
    anchor:
      hash: "sha256:a1b2c3d4e5f6"
      preview: "Always acknowledge the customer's frustration before discussing policy."
      line_hint: 6
    author: bob@acme.com
    date: "2024-03-20"
    source: eval/results/2024-03-18-empathy-ab-test.json
    rationale: |
      A/B test showed 12% improvement in empathy score when this line was added.
      Control: 3.8, Treatment: 4.26, p < 0.01, n=1200.
    tags: [tested, empathy, validated]

  - id: ann_legal_01
    anchor:
      hash: "sha256:f6e5d4c3b2a1"
      preview: "You MUST NOT promise refunds exceeding"
      line_hint: 13
    author: alice@acme.com
    date: "2024-03-15"
    source: https://linear.app/acme/issue/LEGAL-42
    rationale: |
      Legal compliance review required this exact phrasing.
      Approved by legal team on 2024-03-14.
    tags: [legal, compliance, do-not-modify]

  - id: ann_escalation_01
    anchor:
      hash: "sha256:1a2b3c4d5e6f"
      preview: "If the customer mentions legal action, lawyers, or regulatory complaints"
      line_hint: 20
    author: alice@acme.com
    date: "2024-02-28"
    source: https://linear.app/acme/issue/CS-789
    rationale: |
      Added after incident where AI continued negotiating with customer 
      who had already contacted a lawyer. Policy requires immediate 
      human handoff in these cases.
    tags: [policy, escalation, incident-response]

changelog:
  - version: "2.2"
    date: "2024-03-20"
    author: bob@acme.com
    summary: Added empathy acknowledgment line based on A/B test results
    linked_annotations: [ann_empathy_01]
  
  - version: "2.1"
    date: "2024-03-15"
    author: alice@acme.com
    summary: Legal compliance updates for refund limit language
    linked_annotations: [ann_legal_01]
  
  - version: "2.0"
    date: "2024-02-28"
    author: alice@acme.com
    summary: Added escalation rules for legal threats after incident
    linked_annotations: [ann_escalation_01]
  
  - version: "1.0"
    date: "2024-01-10"
    author: alice@acme.com
    summary: Initial version
    linked_annotations: []
